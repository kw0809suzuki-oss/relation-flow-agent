name: Open Learning Probe v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - open_learning_probe_v0.py
      - run_open_learning_probe_v0.py
      - .github/workflows/open-learning-probe-v0.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - name: Run unknown Battle and build open learning packet
        run: python run_open_learning_probe_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: open-learning-probe-v0
          path: open_learning_probe_v0.json
