name: P12 Initial Commitment Rescue v0 Preflight

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - strong_origin_v2_p12_initial_commitment_rescue_v0.py
      - run_p12_initial_commitment_rescue_v0.py
      - .github/workflows/p12-initial-commitment-rescue-v0-preflight.yml
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATTLE_SEED: 7351
      BATTLE_SEAT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_p12_initial_commitment_rescue_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: p12-initial-commitment-rescue-v0-7351
          path: p12_initial_commitment_rescue_v0_7351.json
