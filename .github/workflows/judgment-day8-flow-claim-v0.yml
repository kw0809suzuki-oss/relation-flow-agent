name: Judgment Day8 Flow Claim v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - judgment_day8_flow_claim_v0.py
      - run_judgment_day8_flow_claim_v0.py
      - .github/workflows/judgment-day8-flow-claim-v0.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_judgment_day8_flow_claim_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: judgment-day8-flow-claim-v0
          path: judgment_day8_flow_claim_v0.json
