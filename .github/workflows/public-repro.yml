name: Public Reproduction Check

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - PUBLIC_REPRO_RUN
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: |
          python -m py_compile whole_flow_control_agent.py run_whole_flow_control.py \
            g15_agent.py g16_agent.py g17_agent.py strong_origin_body.py \
            origin_context_integrator.py origin_role_reader.py role_reentry_bridge.py \
            strong_origin.py g8_agent.py g7_agent.py agent.py x_engine.py
      - name: Run public reproduction
        run: python run_whole_flow_control.py
      - name: Validate result shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('whole_flow_control_result.json').read_text())
          assert d['schema'] == 'kaggriculture.whole-relation-flow-control.v1'
          assert len(d['cases']) == 12
          assert d['native_origin_direction_preserved'] is True
          assert d['strong_origin_mutated'] is False
          assert d['result_used_to_define_controller'] is False
          assert d['causal_attribution'] is False
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-reproduction-result
          path: whole_flow_control_result.json
