name: LAND Coarse Prestate High Leverage v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_land_coarse_prestate_high_leverage_v0.py
      - .github/workflows/land-coarse-prestate-high-leverage-v0.yml
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7101, seat: 0}
          - {seed: 7102, seat: 1}
          - {seed: 7103, seat: 0}
          - {seed: 7104, seat: 1}
          - {seed: 7105, seat: 0}
          - {seed: 7106, seat: 1}
          - {seed: 7107, seat: 0}
          - {seed: 7108, seat: 1}
          - {seed: 7109, seat: 0}
          - {seed: 7110, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_land_coarse_prestate_high_leverage_v0.py
