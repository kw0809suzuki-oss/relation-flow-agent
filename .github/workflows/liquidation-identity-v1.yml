name: Liquidation Identity v1

on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - 'observe_liquidation_identity_v1.py'
      - '.github/workflows/liquidation-identity-v1.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: python fetch_opponent.py
      - name: Observe Day15/17 liquidation identity
        run: python observe_liquidation_identity_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: liquidation-identity-v1
          path: liquidation_identity_v1.json
