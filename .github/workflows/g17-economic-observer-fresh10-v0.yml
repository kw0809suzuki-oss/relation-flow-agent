name: G17 Economic Observer fresh10 v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_g17_economic_observer_fresh10_v0.py
      - .github/workflows/g17-economic-observer-fresh10-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - name: Run G17 Current with Economic Observer sidecar
        run: python run_g17_economic_observer_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: g17-economic-observer-fresh10-v0
          path: g17_economic_observer_fresh10_v0.json
