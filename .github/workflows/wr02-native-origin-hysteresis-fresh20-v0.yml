name: WR-02 Native Origin Hysteresis fresh20 v0
permissions:
  contents: read
on:
  push:
    branches: [experiment/wr02-native-origin-hysteresis-v0-20260926]
    paths:
      - .github/workflows/wr02-native-origin-hysteresis-fresh20-v0.yml
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 8701, seat: 0}
          - {seed: 8702, seat: 1}
          - {seed: 8703, seat: 0}
          - {seed: 8704, seat: 1}
          - {seed: 8705, seat: 0}
          - {seed: 8706, seat: 1}
          - {seed: 8707, seat: 0}
          - {seed: 8708, seat: 1}
          - {seed: 8709, seat: 0}
          - {seed: 8710, seat: 1}
          - {seed: 8711, seat: 0}
          - {seed: 8712, seat: 1}
          - {seed: 8713, seat: 0}
          - {seed: 8714, seat: 1}
          - {seed: 8715, seat: 0}
          - {seed: 8716, seat: 1}
          - {seed: 8717, seat: 0}
          - {seed: 8718, seat: 1}
          - {seed: 8719, seat: 0}
          - {seed: 8720, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_wr02_native_origin_hysteresis_fresh20_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr02-native-hysteresis-fresh20-${{ matrix.seed }}
          path: wr02_native_origin_hysteresis_fresh20_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json
  aggregate:
    needs: battle
    if: ${{ needs.battle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wr02-native-hysteresis-fresh20-*
          path: wr02-native-hysteresis-fresh20-artifacts
          merge-multiple: true
      - run: python analyze_wr02_native_origin_hysteresis_fresh20_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr02_native_origin_hysteresis_fresh20_v0_result.json
          git commit -m "Record WR-02 native Origin hysteresis fresh20 v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
