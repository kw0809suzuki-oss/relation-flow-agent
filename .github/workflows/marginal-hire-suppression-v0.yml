name: Marginal HIRE Suppression v0

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - MARGINAL_HIRE_SUPPRESSION_V0_RUN
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh

      - name: Run paired fresh20 Battle
        run: python run_marginal_hire_suppression_v0.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d=json.load(open('marginal_hire_suppression_v0.json'))
          assert d['schema']=='kaggriculture.marginal-hire-suppression.v0'
          assert len(d['cases'])==20
          assert d['candidate']['threshold']==34
          assert d['frame']['seat_balance']=={'seat0':10,'seat1':10}
          assert d['boundary']['promote'] is False
          print(d['summary'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: marginal-hire-suppression-v0
          path: marginal_hire_suppression_v0.json
