name: Decision Boundary Repro

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - DECISION_BOUNDARY_REPRO_RUN
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Boundary tests
        run: python -m pytest -q tests/test_decision_boundaries.py tests/test_judgment_trace_bridge.py
      - name: Run boundary repro battle
        run: python run_decision_boundary_repro.py
      - name: Validate descriptive boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('decision_boundary_repro_result.json').read_text())
          assert d['schema'] == 'kaggriculture.decision-boundary-repro.v1'
          assert d['cycle_count'] > 0
          assert len(d['identical_state_choice_conflicts']) == 0
          assert d['boundary'] == 'descriptive_only_no_rule_promotion'
          assert all(v['promote'] is False for v in d['transitions'].values())
          print({k: v['count'] for k, v in d['transitions'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: decision-boundary-repro-result
          path: decision_boundary_repro_result.json
