name: Full v1 WHEAT Propagation
on:
  push:
    branches: [strong-origin-g5-port]
    paths:
      - 'observe_full_v1_wheat_propagation.py'
      - '.github/workflows/full-v1-wheat-propagation.yml'
jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile observer
        run: python -m py_compile observe_full_v1_wheat_propagation.py full_strong_origin_v1.py strong_origin_g5_roi.py strong_origin_g5.py g8_agent.py x_engine.py
      - name: Run propagation observation
        run: python observe_full_v1_wheat_propagation.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('full_v1_wheat_propagation.json').read_text())
          assert d['schema']=='kaggriculture.full-v1-wheat-propagation.v1'
          assert d['observer_only'] is True and d['agent_mutated'] is False
          assert len(d['cases'])==5
          for r in d['cases']:
              print(r['seed'], r['turn2_delta'], r['turn120_delta'], r['first_zero_after_2'], r['zero_count_after_2'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-v1-wheat-propagation
          path: full_v1_wheat_propagation.json
