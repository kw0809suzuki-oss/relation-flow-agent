name: Payback Closure Stratified Robustness v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - scripts/fetch_stratified_opponents.sh
      - run_payback_closure_stratified_robustness_v0.py
      - .github/workflows/payback-closure-stratified-robustness-v0.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_stratified_opponents.sh
      - run: python run_payback_closure_stratified_robustness_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: payback-closure-stratified-robustness-v0
          path: payback_closure_stratified_robustness_v0.json
