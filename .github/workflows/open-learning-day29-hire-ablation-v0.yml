name: Open Learning Day29 HIRE Ablation v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_open_learning_day29_hire_ablation_v0.py
      - .github/workflows/open-learning-day29-hire-ablation-v0.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_open_learning_day29_hire_ablation_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: open-learning-day29-hire-ablation-v0
          path: open_learning_day29_hire_ablation_v0.json
