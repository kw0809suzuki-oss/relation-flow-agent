name: Full v2.2 Bounded Pulse Pair

on:
  push:
    paths:
      - 'full_strong_origin_v2_2_bounded_pulse.py'
      - 'run_full_v2_2_bounded_pulse_pair.py'
      - '.github/workflows/full-v2-2-bounded-pulse-pair.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: python -m py_compile full_strong_origin_v2_2_bounded_pulse.py run_full_v2_2_bounded_pulse_pair.py full_strong_origin_v2_1_zero_detour.py full_strong_origin_v1.py g8_agent.py strong_origin_g5.py strong_origin_g5_roi.py x_engine.py
      - name: Run bounded-pulse fresh-50 pair
        run: python run_full_v2_2_bounded_pulse_pair.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('full_v2_2_bounded_pulse_pair_result.json').read_text())
          assert d['schema']=='kaggriculture.full-v2-2-bounded-pulse-pair.v1'
          assert d['baseline_mutated'] is False
          assert d['causal_attribution'] is False
          assert d['summary']['case_count']==50
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-v2-2-bounded-pulse-pair-result
          path: full_v2_2_bounded_pulse_pair_result.json
