name: Strong Origin G5 ROI Pair

permissions:
  contents: read

on:
  push:
    branches: [strong-origin-g5-port]
    paths:
      - strong_origin_g5_roi.py
      - run_strong_origin_g5_roi_pair.py
      - .github/workflows/strong-origin-g5-roi-pair.yml
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: python -m py_compile strong_origin_g5.py strong_origin_g5_roi.py run_strong_origin_g5_roi_pair.py x_engine.py
      - name: Run paired evaluation
        run: python run_strong_origin_g5_roi_pair.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('strong_origin_g5_roi_pair_result.json').read_text())
          assert d['schema'] == 'kaggriculture.strong-origin-g5-roi-pair.v1'
          assert len(d['cases']) == 50
          assert d['baseline_mutated'] is False
          assert d['result_used_to_define_candidate'] is False
          assert d['causal_attribution'] is False
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strong-origin-g5-roi-pair-result
          path: strong_origin_g5_roi_pair_result.json
