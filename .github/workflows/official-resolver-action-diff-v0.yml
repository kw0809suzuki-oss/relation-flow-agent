name: Official Resolver Action Diff v0
permissions:
  contents: read

on:
  push:
    branches:
      - experiment/official-world-resolver-v0
    paths:
      - .github/workflows/official-resolver-action-diff-v0.yml
      - official_resolved_agent.py
      - OFFICIAL_RESOLVER_ACTION_DIFF_RUN
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run probe
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from kaggle_environments import make
          import official_resolved_agent as current
          import opponents.seyamalam_v21 as opponent

          rows=[]
          aggregate=Counter()
          market_shapes=Counter()
          for seed in range(7001,7011):
              current.reset_telemetry()
              for name in ('reset_telemetry','reset_trace','reset'):
                  fn=getattr(opponent,name,None)
                  if callable(fn):
                      try: fn()
                      except TypeError: pass
              env=make('kaggriculture',configuration={'seed':seed},debug=False)
              env.run([current.agent,opponent.agent])
              t=current.get_telemetry()
              trace=current.get_trace()['official_resolver']
              aggregate['turns']+=t['turns']
              aggregate['changed_turns']+=t['changed_turns']
              aggregate['farmer_changes']+=t['farmer_changes']
              aggregate['hand_changes']+=t['hand_changes']
              aggregate['market_changes']+=t['market_changes']

              seed_shapes=Counter()
              examples=[]
              for e in trace:
                  if e['market_changed']:
                      before=e['candidate_market']; after=e['resolved_market']
                      if len(before)!=len(after):
                          key='market_order_count'
                      else:
                          key='market_qty_or_content'
                      seed_shapes[key]+=1; market_shapes[key]+=1
                  if e['farmer_changed'] or e['hand_changed_count']:
                      seed_shapes['unit_action']+=1
                  if len(examples)<5:
                      examples.append(e)
              rows.append({
                  'seed':seed,
                  'self':float(env.state[0].reward),
                  'opponent':float(env.state[1].reward),
                  'telemetry':{k:t[k] for k in ('turns','changed_turns','farmer_changes','hand_changes','market_changes')},
                  'shapes':dict(seed_shapes),
                  'examples':examples,
              })
          out={
              'schema':'official-resolver-action-diff-v0',
              'aggregate':dict(aggregate),
              'market_shapes':dict(market_shapes),
              'seeds':rows,
              'boundary':'descriptive action-difference observation only'
          }
          open('official_resolver_action_diff_v0.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-resolver-action-diff-v0
          path: official_resolver_action_diff_v0.json
