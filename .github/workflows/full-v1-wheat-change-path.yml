name: Full v1 WHEAT Change Path

on:
  push:
    branches: [ strong-origin-g5-port ]
    paths:
      - observe_full_v1_wheat_change_path.py
      - .github/workflows/full-v1-wheat-change-path.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile observer
        run: python -m py_compile observe_full_v1_wheat_change_path.py full_strong_origin_v1.py strong_origin_g5_roi.py strong_origin_g5.py g8_agent.py x_engine.py
      - name: Run full change-path observation
        run: python observe_full_v1_wheat_change_path.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('full_v1_wheat_change_path.json').read_text())
          assert d['observer_only'] and not d['agent_mutated']
          assert not d['terminal_read'] and not d['margin_read']
          assert len(d['cases'])==5
          for c in d['cases']:
              print(c['seed'], [(p['turn'],p['delta'],p['delta_step']) for p in c['points']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-v1-wheat-change-path
          path: full_v1_wheat_change_path.json
