name: Harvest Sell punch v1
on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - harvest_sell_punch_v1.py
      - run_harvest_sell_punch_v1.py
      - .github/workflows/harvest-sell-punch-v1.yml
jobs:
  ab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_harvest_sell_punch_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-sell-punch-v1
          path: harvest_sell_punch_v1.json
