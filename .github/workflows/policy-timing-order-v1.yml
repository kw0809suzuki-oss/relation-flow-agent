name: Policy Timing Order v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths: [policy_timing_order_v1.py, .github/workflows/policy-timing-order-v1.yml]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python policy_timing_order_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: policy-timing-order-v1
          path: policy_timing_order_v1.json
