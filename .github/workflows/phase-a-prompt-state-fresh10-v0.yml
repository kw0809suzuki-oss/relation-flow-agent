name: Phase A Prompt State fresh10 v0
permissions:
  contents: read
on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/phase-a-prompt-state-fresh10-v0.yml
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 8701, seat: 0}
          - {seed: 8702, seat: 1}
          - {seed: 8703, seat: 0}
          - {seed: 8704, seat: 1}
          - {seed: 8705, seat: 0}
          - {seed: 8706, seat: 1}
          - {seed: 8707, seat: 0}
          - {seed: 8708, seat: 1}
          - {seed: 8709, seat: 0}
          - {seed: 8710, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_phase_a_prompt_state_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase-a-prompt-state-${{ matrix.seed }}
          path: phase_a_prompt_state_fresh10_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json
  aggregate:
    needs: capture
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: ${{ github.ref_name }}, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-a-prompt-state-*
          path: phase-a-prompt-state-artifacts
          merge-multiple: true
      - run: python aggregate_phase_a_prompt_state_fresh10_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase_a_prompt_state_fresh10_v0_aggregate.json
          git commit -m "Record Phase A prompt state fresh10 v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
