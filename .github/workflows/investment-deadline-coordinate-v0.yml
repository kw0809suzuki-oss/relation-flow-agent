name: Investment Deadline Coordinate v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/investment-deadline-coordinate-v0-20260922]
    paths:
      - INVESTMENT_DEADLINE_COORDINATE_V0_RUN
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7101, seat: 0}
          - {seed: 7102, seat: 1}
          - {seed: 7103, seat: 0}
          - {seed: 7104, seat: 1}
          - {seed: 7105, seat: 0}
          - {seed: 7106, seat: 1}
          - {seed: 7107, seat: 0}
          - {seed: 7108, seat: 1}
          - {seed: 7109, seat: 0}
          - {seed: 7110, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_investment_deadline_coordinate_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: investment-deadline-coordinate-v0-${{ matrix.seed }}
          path: investment_deadline_coordinate_v0_${{ matrix.seed }}.json
