name: Battle Value Map v0 Seed7352 Seat1

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/battle-value-map-v0-seed7352-seat1.yml
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BATTLE_SEED: 7352
      BATTLE_SEAT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_value_map_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: battle-value-map-v0-seed7352-seat1
          path: battle_value_map_v0_7352_seat1.json
