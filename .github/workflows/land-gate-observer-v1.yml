name: Land Gate Observer v1
on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - run_land_gate_observer_v1.py
      - .github/workflows/land-gate-observer-v1.yml
jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_land_gate_observer_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: land-gate-observer-v1
          path: land_gate_observer_v1.json
