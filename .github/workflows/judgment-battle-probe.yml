name: Judgment Frame Battle Probe

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - JUDGMENT_PROBE_RUN
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Contract tests
        run: python -m pytest -q tests/test_judgment_trace_bridge.py tests/test_boundary_aftermath.py
      - name: Run one battle judgment probe
        run: python run_judgment_probe.py
      - name: Validate judgment boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('judgment_probe_result.json').read_text())
          assert d['schema'] == 'kaggriculture.judgment-frame-probe.v2'
          assert d['judgment_cycle_count'] > 0
          assert d['principle_checks']['choice_execution_separated'] is True
          assert d['principle_checks']['terminal_not_copied_into_local_learn'] is True
          assert d['principle_checks']['battle_outcome_has_no_causal_attribution'] is True
          assert d['principle_checks']['experience_auto_adopted'] is False
          print({
              'battle_outcome': d['battle_outcome']['result'],
              'judgment_cycle_count': d['judgment_cycle_count'],
          })
          PY
      - name: Analyze local aftermath
        run: python analyze_boundary_aftermath.py judgment_probe_result.json
      - name: Validate aftermath boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('decision_boundary_aftermath.json').read_text())
          assert d['schema'] == 'kaggriculture.decision-boundary-aftermath.v1'
          assert d['cycle_count'] > 0
          assert d['boundary'] == 'descriptive_only_no_causal_attribution_no_rule_promotion'
          assert all(v['causal_attribution'] is False for v in d['aftermath'].values())
          assert all(v['promote'] is False for v in d['aftermath'].values())
          print({k: {'transition_count': v['transition_count'], 'observed_count': v['observed_count'], 'mean': v['mean'], 'positive_vote_mean': v['positive_vote_mean']} for k, v in d['aftermath'].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: judgment-probe-result
          path: |
            judgment_probe_result.json
            decision_boundary_aftermath.json
