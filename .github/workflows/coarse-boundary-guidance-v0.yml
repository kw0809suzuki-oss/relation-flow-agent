name: Coarse Boundary Guidance v0
permissions:
  contents: read
on:
  push:
    branches: [experiment/coarse-boundary-guidance-v0-20260923]
    paths: [COARSE_BOUNDARY_GUIDANCE_V0_RUN]
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7171, seat: 0}
          - {seed: 7172, seat: 1}
          - {seed: 7173, seat: 0}
          - {seed: 7174, seat: 1}
          - {seed: 7175, seat: 0}
          - {seed: 7176, seat: 1}
          - {seed: 7177, seat: 0}
          - {seed: 7178, seat: 1}
          - {seed: 7179, seat: 0}
          - {seed: 7180, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_coarse_boundary_guidance_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: coarse-boundary-guidance-v0-${{ matrix.seed }}
          path: coarse_boundary_guidance_v0_${{ matrix.seed }}.json
  aggregate:
    needs: battle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: coarse-boundary-guidance-v0-*, path: artifacts}
      - run: python aggregate_coarse_boundary_guidance_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: coarse-boundary-guidance-v0-aggregate
          path: coarse_boundary_guidance_v0_aggregate.json
