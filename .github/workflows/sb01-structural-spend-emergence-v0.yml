name: SB01 Structural Spend Emergence v0

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - analyze_sb01_structural_spend_emergence_v0.py
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 35847685995
          github-token: ${{ github.token }}
          pattern: sb01-exact-cash-flow-daily-7*
          path: inputs/cash
          merge-multiple: true
      - run: python analyze_sb01_structural_spend_emergence_v0.py inputs/cash
      - uses: actions/upload-artifact@v4
        with:
          name: sb01-structural-spend-emergence-v0
          path: sb01_structural_spend_emergence_v0.json
