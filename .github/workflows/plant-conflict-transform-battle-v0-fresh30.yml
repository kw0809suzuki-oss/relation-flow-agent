name: Plant Conflict Transform Battle v0 Fresh30

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/plant-conflict-transform-battle-v0-fresh30.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7501, seat: 0}
          - {seed: 7502, seat: 1}
          - {seed: 7503, seat: 0}
          - {seed: 7504, seat: 1}
          - {seed: 7505, seat: 0}
          - {seed: 7506, seat: 1}
          - {seed: 7507, seat: 0}
          - {seed: 7508, seat: 1}
          - {seed: 7509, seat: 0}
          - {seed: 7510, seat: 1}
          - {seed: 7511, seat: 0}
          - {seed: 7512, seat: 1}
          - {seed: 7513, seat: 0}
          - {seed: 7514, seat: 1}
          - {seed: 7515, seat: 0}
          - {seed: 7516, seat: 1}
          - {seed: 7517, seat: 0}
          - {seed: 7518, seat: 1}
          - {seed: 7519, seat: 0}
          - {seed: 7520, seat: 1}
          - {seed: 7521, seat: 0}
          - {seed: 7522, seat: 1}
          - {seed: 7523, seat: 0}
          - {seed: 7524, seat: 1}
          - {seed: 7525, seat: 0}
          - {seed: 7526, seat: 1}
          - {seed: 7527, seat: 0}
          - {seed: 7528, seat: 1}
          - {seed: 7529, seat: 0}
          - {seed: 7530, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_plant_conflict_transform_battle_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: plant-conflict-transform-${{ matrix.seed }}
          path: plant_conflict_transform_battle_v0_${{ matrix.seed }}.json

  aggregate:
    needs: battle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: plant-conflict-transform-*
          path: inputs
          merge-multiple: true
      - run: python analyze_plant_conflict_transform_battle_v0.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: plant-conflict-transform-battle-v0-fresh30
          path: plant_conflict_transform_battle_v0_result.json
