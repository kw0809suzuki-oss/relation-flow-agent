name: Beta Connection V1 50

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - BETA_CONNECTION_V1_RUN
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: |
          python -m py_compile run_beta_connection_v1_50.py beta_connection_agent_v1.py \
            g15_agent.py g16_agent.py g17_agent.py strong_origin_body.py \
            origin_context_integrator.py origin_role_reader.py role_reentry_bridge.py \
            strong_origin.py g8_agent.py g7_agent.py agent.py x_engine.py
      - name: Run paired 50-seed connection test
        run: python run_beta_connection_v1_50.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('beta_connection_v1_50_3362_3411.json').read_text())
          assert d['schema'] == 'kaggriculture.connection.beta-stop-next-day.v1.50'
          assert len(d['cases']) == 50
          assert d['terminal_used_to_define_connection'] is False
          assert d['native_origin_direction_preserved'] is True
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-connection-v1-50-3362-3411
          path: beta_connection_v1_50_3362_3411.json
