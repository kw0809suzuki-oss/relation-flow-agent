name: High Leverage Seed Commitment Timing v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_high_leverage_seed_commitment_timing_v0.py
      - .github/workflows/high-leverage-seed-commitment-timing-v0.yml
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7271, seat: 0}
          - {seed: 7272, seat: 1}
          - {seed: 7273, seat: 0}
          - {seed: 7274, seat: 1}
          - {seed: 7275, seat: 0}
          - {seed: 7276, seat: 1}
          - {seed: 7277, seat: 0}
          - {seed: 7278, seat: 1}
          - {seed: 7279, seat: 0}
          - {seed: 7280, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_high_leverage_seed_commitment_timing_v0.py
