name: Transition Link v0
on:
  push:
    branches: [transition-link-v0]
    paths:
      - transition_link_v0.py
      - run_transition_link_v0.py
      - .github/workflows/transition-link-v0.yml
  workflow_dispatch:
jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run Transition Link v0 A/B
        run: python run_transition_link_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: transition-link-v0
          path: transition_link_v0.json
