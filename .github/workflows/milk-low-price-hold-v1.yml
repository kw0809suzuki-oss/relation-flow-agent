name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_bundle_flow_gate_boundary_v1.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  bundle-flow-gate-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe Bundle Flow Gate boundary
        run: python observe_bundle_flow_gate_boundary_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-flow-gate-boundary-v1
          path: bundle_flow_gate_boundary_v1.json
