name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_late_nonoverlap_value_flow_v2.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  late-nonoverlap-value-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe late non-overlap Value Flow
        run: python observe_late_nonoverlap_value_flow_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: late-nonoverlap-value-flow-v2
          path: late_nonoverlap_value_flow_v2.json
