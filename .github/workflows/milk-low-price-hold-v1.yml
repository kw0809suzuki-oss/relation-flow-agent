name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_cash_flow_wave_v1.py
      - observe_cash_flow_time_profile_v2.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  time-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe Cash Flow time profile v2
        run: python observe_cash_flow_time_profile_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: cash-flow-time-profile-v2
          path: cash_flow_time_profile_v2.json
