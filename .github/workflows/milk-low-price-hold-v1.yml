name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_cash_flow_wave_v1.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe money-wave Cash Flow v1
        run: python observe_cash_flow_wave_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: cash-flow-wave-v1
          path: cash_flow_wave_observer_v1.json
