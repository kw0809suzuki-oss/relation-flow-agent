name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_whole_value_bundle_flow_v1.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  whole-value-bundle-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe whole Value Bundle Flow
        run: python observe_whole_value_bundle_flow_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: whole-value-bundle-flow-v1
          path: whole_value_bundle_flow_v1.json
