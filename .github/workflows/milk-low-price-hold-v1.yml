name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - observe_late_cycle_composition_v1.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  late-cycle-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe late cycle composition
        run: python observe_late_cycle_composition_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: late-cycle-composition-v1
          path: late_cycle_composition_v1.json
