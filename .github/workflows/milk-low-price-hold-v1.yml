name: MILK Low Price Hold v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - g15_agent.py
      - run_bundle_flow_control_v0.py
      - .github/workflows/milk-low-price-hold-v1.yml
  workflow_dispatch:
jobs:
  bundle-flow-control-v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run Bundle Flow Control v0 fresh10
        run: python run_bundle_flow_control_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-flow-control-v0-fresh20
          path: bundle_flow_control_v0_fresh20.json
