name: First Generated Return Input Bridge v0
permissions:
  contents: read
on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/first-generated-return-input-bridge-v0.yml
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7351, seat: 0}
          - {seed: 7352, seat: 1}
          - {seed: 7353, seat: 0}
          - {seed: 7354, seat: 1}
          - {seed: 7355, seat: 0}
          - {seed: 7356, seat: 1}
          - {seed: 7357, seat: 0}
          - {seed: 7358, seat: 1}
          - {seed: 7359, seat: 0}
          - {seed: 7360, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_first_generated_return_input_bridge_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-return-bridge-${{ matrix.seed }}
          path: first_generated_return_input_bridge_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json
  aggregate:
    needs: observe
    if: ${{ needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: generated-return-bridge-*
          path: generated-return-bridge-artifacts
          merge-multiple: true
      - run: python analyze_first_generated_return_input_bridge_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add first_generated_return_input_bridge_v0_result.json
          git commit -m "Record first generated Return input bridge v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
