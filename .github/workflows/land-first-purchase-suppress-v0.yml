name: LAND First Purchase Suppress v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - land_first_purchase_suppress_v0.py
      - run_land_first_purchase_suppress_v0.py
      - .github/workflows/land-first-purchase-suppress-v0.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_land_first_purchase_suppress_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: land-first-purchase-suppress-v0
          path: land_first_purchase_suppress_v0.json
