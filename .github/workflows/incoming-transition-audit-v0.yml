name: Incoming Transition Audit v0

permissions:
  contents: write

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/incoming-transition-audit-v0.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - run: python analyze_incoming_transition_audit_v0.py
      - name: Record Incoming Transition Audit v0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming_transition_audit_v0_result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Incoming Transition Audit v0"
          git push origin HEAD:"${GITHUB_REF_NAME}"
