name: Closure Receiver Final Separator Audit

permissions:
  contents: read

on:
  push:
    branches:
      - experiment/closure-gain-sweep-20260921
    paths:
      - CLOSURE_RECEIVER_FINAL_SEPARATOR_AUDIT_RUN
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run final separator audit
        run: python run_closure_receiver_final_separator_audit_v0.py
      - name: Validate audit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('closure_receiver_final_separator_audit_v0.json').read_text())
          assert d['schema']=='kaggriculture.closure-receiver-final-separator-audit.v0'
          assert len(d['rows'])==40
          assert d['boundary']['discovery_only'] is True
          assert d['boundary']['new_observer_fields'] is False
          assert d['boundary']['receiver_features_forbidden'] is True
          assert d['boundary']['seat_forbidden'] is True
          assert d['boundary']['terminal_features_forbidden'] is True
          assert d['boundary']['complex_feature_combinations_forbidden'] is True
          assert d['boundary']['max_returned_separator']==1
          assert d['boundary']['promote'] is False
          assert d['boundary']['adopt'] is False
          assert d['decision'] in {
              'ONE_SEPARATOR_FOR_INDEPENDENT_BATTLE',
              'NO_DEPLOYABLE_SEPARATOR_CLOSE_CLOSURE_RECEIVER'
          }
          print({
              'fresh40_reproduction': d['fresh40_reproduction'],
              'passing_separator_count': d['passing_separator_count'],
              'selected_separator': d['selected_separator'],
              'decision': d['decision'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: closure-receiver-final-separator-audit-v0
          path: closure_receiver_final_separator_audit_v0.json
