name: Battle First Parallel 20 Active Candidate
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_battle_first_parallel_active_candidate_v0.py
      - .github/workflows/battle-first-parallel-20-active-candidate.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {seed: 6323, seat: 0}
          - {seed: 6324, seat: 1}
          - {seed: 6325, seat: 0}
          - {seed: 6326, seat: 1}
          - {seed: 6327, seat: 0}
          - {seed: 6328, seat: 1}
          - {seed: 6329, seat: 0}
          - {seed: 6330, seat: 1}
          - {seed: 6331, seat: 0}
          - {seed: 6332, seat: 1}
          - {seed: 6333, seat: 0}
          - {seed: 6334, seat: 1}
          - {seed: 6335, seat: 0}
          - {seed: 6336, seat: 1}
          - {seed: 6337, seat: 0}
          - {seed: 6338, seat: 1}
          - {seed: 6339, seat: 0}
          - {seed: 6340, seat: 1}
          - {seed: 6341, seat: 0}
          - {seed: 6342, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_first_parallel_active_candidate_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-battle-${{ matrix.seed }}
          path: parallel_battle_${{ matrix.seed }}.json
