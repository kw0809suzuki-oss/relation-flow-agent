name: Battle First Parallel 20 Active Candidate
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_battle_first_parallel_active_candidate_v0.py
      - .github/workflows/battle-first-parallel-20-active-candidate.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {seed: 6303, seat: 0}
          - {seed: 6304, seat: 1}
          - {seed: 6305, seat: 0}
          - {seed: 6306, seat: 1}
          - {seed: 6307, seat: 0}
          - {seed: 6308, seat: 1}
          - {seed: 6309, seat: 0}
          - {seed: 6310, seat: 1}
          - {seed: 6311, seat: 0}
          - {seed: 6312, seat: 1}
          - {seed: 6313, seat: 0}
          - {seed: 6314, seat: 1}
          - {seed: 6315, seat: 0}
          - {seed: 6316, seat: 1}
          - {seed: 6317, seat: 0}
          - {seed: 6318, seat: 1}
          - {seed: 6319, seat: 0}
          - {seed: 6320, seat: 1}
          - {seed: 6321, seat: 0}
          - {seed: 6322, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_first_parallel_active_candidate_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-battle-${{ matrix.seed }}
          path: parallel_battle_${{ matrix.seed }}.json
