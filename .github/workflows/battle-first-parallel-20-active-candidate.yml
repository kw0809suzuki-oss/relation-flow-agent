name: Battle First Parallel 20 Active Candidate
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_battle_first_parallel_active_candidate_v0.py
      - .github/workflows/battle-first-parallel-20-active-candidate.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {seed: 6283, seat: 0}
          - {seed: 6284, seat: 1}
          - {seed: 6285, seat: 0}
          - {seed: 6286, seat: 1}
          - {seed: 6287, seat: 0}
          - {seed: 6288, seat: 1}
          - {seed: 6289, seat: 0}
          - {seed: 6290, seat: 1}
          - {seed: 6291, seat: 0}
          - {seed: 6292, seat: 1}
          - {seed: 6293, seat: 0}
          - {seed: 6294, seat: 1}
          - {seed: 6295, seat: 0}
          - {seed: 6296, seat: 1}
          - {seed: 6297, seat: 0}
          - {seed: 6298, seat: 1}
          - {seed: 6299, seat: 0}
          - {seed: 6300, seat: 1}
          - {seed: 6301, seat: 0}
          - {seed: 6302, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_first_parallel_active_candidate_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-battle-${{ matrix.seed }}
          path: parallel_battle_${{ matrix.seed }}.json
