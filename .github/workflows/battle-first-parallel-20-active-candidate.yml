name: Battle First Parallel 20 Active Candidate
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_battle_first_parallel_active_candidate_v0.py
      - .github/workflows/battle-first-parallel-20-active-candidate.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {seed: 6263, seat: 0}
          - {seed: 6264, seat: 1}
          - {seed: 6265, seat: 0}
          - {seed: 6266, seat: 1}
          - {seed: 6267, seat: 0}
          - {seed: 6268, seat: 1}
          - {seed: 6269, seat: 0}
          - {seed: 6270, seat: 1}
          - {seed: 6271, seat: 0}
          - {seed: 6272, seat: 1}
          - {seed: 6273, seat: 0}
          - {seed: 6274, seat: 1}
          - {seed: 6275, seat: 0}
          - {seed: 6276, seat: 1}
          - {seed: 6277, seat: 0}
          - {seed: 6278, seat: 1}
          - {seed: 6279, seat: 0}
          - {seed: 6280, seat: 1}
          - {seed: 6281, seat: 0}
          - {seed: 6282, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_first_parallel_active_candidate_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: parallel-battle-${{ matrix.seed }}
          path: parallel_battle_${{ matrix.seed }}.json
