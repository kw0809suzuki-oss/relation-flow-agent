name: D16 D18 Payback Replay v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_d16_d18_payback_replay_v0.py
      - .github/workflows/d16-d18-payback-replay-v0.yml
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_d16_d18_payback_replay_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: d16-d18-payback-replay-v0
          path: d16_d18_payback_replay_v0.json
