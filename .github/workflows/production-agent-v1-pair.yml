name: Production Agent v1 Pair

on:
  push:
    branches: [ strong-origin-g5-port ]
    paths:
      - 'production_agent_v1.py'
      - 'run_production_agent_v1_pair.py'
      - '.github/workflows/production-agent-v1-pair.yml'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: python -m py_compile production_agent_v1.py run_production_agent_v1_pair.py full_strong_origin_v1.py g8_agent.py strong_origin_g5.py strong_origin_g5_roi.py x_engine.py
      - name: Run paired production evaluation
        run: python run_production_agent_v1_pair.py
      - name: Validate boundary and result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('production_agent_v1_pair_result.json').read_text())
          assert d['schema']=='kaggriculture.production-agent-v1-pair.v1'
          assert len(d['cases'])==20
          assert d['observation_boundary']['bundle_used_for_control'] is False
          assert d['observation_boundary']['relation_used_for_control'] is False
          assert d['observation_boundary']['flow_used_for_control'] is False
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-agent-v1-pair-result
          path: production_agent_v1_pair_result.json
