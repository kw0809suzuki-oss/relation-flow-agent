name: SB01 WHEAT Flow Path Preflight v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - run_sb01_wheat_flow_path_v0.py
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BATTLE_SEED: 7001
      BATTLE_SEAT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_sb01_wheat_flow_path_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: sb01-wheat-flow-path-preflight-7001
          path: sb01_wheat_flow_path_7001.json
