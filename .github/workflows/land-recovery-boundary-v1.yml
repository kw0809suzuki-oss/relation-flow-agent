name: LAND Recovery Boundary v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths: [land_recovery_boundary_v1.py, .github/workflows/land-recovery-boundary-v1.yml]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python land_recovery_boundary_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: land-recovery-boundary-v1
          path: land_recovery_boundary_v1.json
