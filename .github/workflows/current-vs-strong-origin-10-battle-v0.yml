name: Current vs Strong Origin 10 Battle v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_current_vs_strong_origin_10_battle_v0.py
      - .github/workflows/current-vs-strong-origin-10-battle-v0.yml
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_current_vs_strong_origin_10_battle_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: current-vs-strong-origin-10-battle-v0
          path: current_vs_strong_origin_10_battle_v0.json
