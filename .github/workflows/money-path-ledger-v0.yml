name: Money Path Ledger v0
permissions:
  contents: read
on:
  push:
    branches: [observer/money-path-ledger-v0-20260923]
    paths: [MONEY_PATH_LEDGER_V0_RUN]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7241, seat: 0}
          - {seed: 7242, seat: 1}
          - {seed: 7243, seat: 0}
          - {seed: 7244, seat: 1}
          - {seed: 7245, seat: 0}
          - {seed: 7246, seat: 1}
          - {seed: 7247, seat: 0}
          - {seed: 7248, seat: 1}
          - {seed: 7249, seat: 0}
          - {seed: 7250, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_money_path_ledger_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: money-path-ledger-v0-${{ matrix.seed }}
          path: money_path_ledger_v0_${{ matrix.seed }}.json
  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: money-path-ledger-v0-*, path: artifacts}
      - run: python aggregate_money_path_ledger_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: money-path-ledger-v0-aggregate
          path: money_path_ledger_v0_aggregate.json
