name: WR-01 Purchase Plant Conversion Audit v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/wr01-purchase-plant-conversion-audit-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seed: 7351, seat: 0}
          - {seed: 7352, seat: 1}
          - {seed: 7353, seat: 0}
          - {seed: 7354, seat: 1}
          - {seed: 7355, seat: 0}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_wr01_purchase_plant_conversion_audit_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr01-purchase-plant-${{ matrix.seed }}
          path: wr01_purchase_plant_conversion_audit_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json

  aggregate:
    needs: observe
    if: ${{ needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wr01-purchase-plant-*
          path: wr01-purchase-plant-artifacts
          merge-multiple: true
      - run: python analyze_wr01_purchase_plant_conversion_audit_v0.py
      - name: Record result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr01_purchase_plant_conversion_audit_v0_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record WR-01 purchase plant conversion audit v0"
          git push origin HEAD:"${GITHUB_REF_NAME}"
