name: Payback Closure Candidate fresh10 rep2 v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_payback_closure_candidate_fresh10_rep2_v0.py
      - .github/workflows/payback-closure-candidate-fresh10-rep2-v0.yml
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_payback_closure_candidate_fresh10_rep2_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: payback-closure-candidate-fresh10-rep2-v0
          path: payback_closure_candidate_fresh10_rep2_v0.json
