name: COW MILK6 Cash-back Decomposition v0

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - COW_MILK6_CASHBACK_DECOMP_RUN
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore historical COW probe worktree
        run: |
          git worktree add /tmp/cow-historical 27cac110515eca257c157904984add017d5ea8bb
          cp economic_flow_observer_v0.py /tmp/cow-historical/
          cp economic_flow_upstream_observer_v01.py /tmp/cow-historical/
          cp cash_jump_transition_observer_v0.py /tmp/cow-historical/
          cp milk6_cashback_decomposition_observer_v0.py /tmp/cow-historical/
          cp run_cow_milk6_cashback_decomposition_v0.py /tmp/cow-historical/
      - name: Install dependencies
        working-directory: /tmp/cow-historical
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch pinned opponent
        working-directory: /tmp/cow-historical
        run: bash scripts/fetch_opponent.sh
      - name: Observe MILK6 cash-back decomposition
        working-directory: /tmp/cow-historical
        run: python run_cow_milk6_cashback_decomposition_v0.py
      - name: Validate
        working-directory: /tmp/cow-historical
        run: |
          python - <<'PY'
          import json
          d=json.load(open('cow_milk6_cashback_decomposition_v0.json'))
          assert d['principle']['observer_only'] is True
          assert d['promote'] is False
          assert d['summary']['improved']['count']==6
          assert d['summary']['worsened']['count']==4
          print(d['summary'])
          PY
      - name: Copy result
        run: cp /tmp/cow-historical/cow_milk6_cashback_decomposition_v0.json .
      - uses: actions/upload-artifact@v4
        with:
          name: cow-milk6-cashback-decomposition-v0
          path: cow_milk6_cashback_decomposition_v0.json
