name: Coarse Transition Effect Trace v0
permissions:
  contents: read
on:
  push:
    branches: [observer/coarse-transition-effect-trace-v0-20260923]
    paths: [COARSE_TRANSITION_EFFECT_TRACE_V0_RUN]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seed: 7171, seat: 0}
          - {seed: 7176, seat: 1}
          - {seed: 7177, seat: 0}
          - {seed: 7179, seat: 0}
          - {seed: 7180, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_coarse_transition_effect_trace_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: coarse-transition-effect-trace-v0-${{ matrix.seed }}
          path: coarse_transition_effect_trace_v0_${{ matrix.seed }}.json
  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: coarse-transition-effect-trace-v0-*, path: artifacts}
      - run: python aggregate_coarse_transition_effect_trace_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: coarse-transition-effect-trace-v0-aggregate
          path: coarse_transition_effect_trace_v0_aggregate.json
