name: SB01 Day0 Aligned PLANT Execution Audit v1

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - SB01_DAY0_ALIGNED_PLANT_EXECUTION_RUN
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 35836285226
          github-token: ${{ github.token }}
          pattern: sb01-day0-aligned-input-*
          path: inputs
          merge-multiple: true
      - run: python analyze_sb01_day0_aligned_plant_execution_audit_v1.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: sb01-day0-aligned-plant-execution-audit-v1
          path: sb01_day0_aligned_plant_execution_audit_v1.json
