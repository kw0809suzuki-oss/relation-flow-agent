name: Final-mile Liquidation v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/final-mile-liquidation-v0-20260922]
    paths:
      - FINAL_MILE_LIQUIDATION_V0_RUN
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7081, seat: 0}
          - {seed: 7082, seat: 1}
          - {seed: 7083, seat: 0}
          - {seed: 7084, seat: 1}
          - {seed: 7085, seat: 0}
          - {seed: 7086, seat: 1}
          - {seed: 7087, seat: 0}
          - {seed: 7088, seat: 1}
          - {seed: 7089, seat: 0}
          - {seed: 7090, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_final_mile_liquidation_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-mile-liquidation-v0-${{ matrix.seed }}
          path: final_mile_liquidation_v0_${{ matrix.seed }}.json
