name: LAND midgame recovery v1

on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - "run_land_midgame_recovery_v1.py"
      - ".github/workflows/land-midgame-recovery-v1.yml"

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_land_midgame_recovery_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: land-midgame-recovery-v1
          path: land_midgame_recovery_v1.json
