name: Milk Precursor v1

on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - 'observe_milk_precursor_v1.py'
      - '.github/workflows/milk-precursor-v1.yml'

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - name: Reverse-trace Day15 MILK precursor
        run: python observe_milk_precursor_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: milk-precursor-v1
          path: milk_precursor_v1.json
