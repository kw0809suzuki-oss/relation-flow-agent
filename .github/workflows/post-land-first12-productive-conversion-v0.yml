name: Post LAND First12 Productive Conversion v0
permissions:
  contents: read
  actions: read
on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/post-land-first12-productive-conversion-v0.yml
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 35913668518
          github-token: ${{ github.token }}
          pattern: land-plant-realization-audit-v0-7*
          path: inputs
          merge-multiple: true
      - run: python analyze_post_land_first12_productive_conversion_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_land_first12_productive_conversion_audit_v0_result.json
          git commit -m "Record post-LAND first12 conversion audit v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
