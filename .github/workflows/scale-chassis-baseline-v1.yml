name: Scale Chassis baseline v1

on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - "export_scale_baseline_v1.py"
      - ".github/workflows/scale-chassis-baseline-v1.yml"

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python export_scale_baseline_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: scale-baseline-v1
          path: scale_baseline_v1.json
