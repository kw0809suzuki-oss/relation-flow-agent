name: Multi Battle Boundary Aftermath

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - MULTI_BATTLE_AFTERMATH_RUN
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Contract tests
        run: python -m pytest -q tests/test_boundary_aftermath.py tests/test_boundary_aftermath_contrast.py tests/test_judgment_trace_bridge.py
      - name: Run multi battle aftermath
        run: python run_multi_battle_boundary_aftermath.py
      - name: Validate boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('multi_battle_boundary_aftermath.json').read_text())
          assert d['schema'] == 'kaggriculture.multi-battle-boundary-aftermath.v1'
          assert len(d['battles']) == 3
          assert d['boundary'] == 'descriptive_only_no_causal_attribution_no_rule_promotion'
          assert all(v['causal_attribution'] is False for v in d['aggregate_contrasts'].values())
          assert all(v['promote'] is False for v in d['aggregate_contrasts'].values())
          print(d['aggregate_contrasts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-battle-boundary-aftermath
          path: multi_battle_boundary_aftermath.json
