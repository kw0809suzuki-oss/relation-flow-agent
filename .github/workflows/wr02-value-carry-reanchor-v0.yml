name: WR-02 Value Carry Re-anchor v0

permissions:
  contents: read

on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/wr02-value-carry-reanchor-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seed: 7351, seat: 0}
          - {seed: 7352, seat: 1}
          - {seed: 7353, seat: 0}
          - {seed: 7354, seat: 1}
          - {seed: 7355, seat: 0}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_wr02_value_carry_reanchor_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: wr02-value-carry-${{ matrix.seed }}
          path: wr02_production_downstream_boundary_surface_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json

  aggregate:
    needs: observe
    if: ${{ needs.observe.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: wr02-value-carry-*
          path: wr02-value-carry-artifacts
          merge-multiple: true
      - run: python analyze_wr02_value_carry_reanchor_v0.py
      - name: Record WR-02 Value Carry Re-anchor v0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wr02_value_carry_reanchor_v0_result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record WR-02 Value Carry Re-anchor v0"
          git push origin HEAD:"${GITHUB_REF_NAME}"
