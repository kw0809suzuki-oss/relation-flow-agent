name: High Leverage Harvest Timing v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_high_leverage_harvest_timing_v0.py
      - .github/workflows/high-leverage-harvest-timing-v0.yml
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7251, seat: 0}
          - {seed: 7252, seat: 1}
          - {seed: 7253, seat: 0}
          - {seed: 7254, seat: 1}
          - {seed: 7255, seat: 0}
          - {seed: 7256, seat: 1}
          - {seed: 7257, seat: 0}
          - {seed: 7258, seat: 1}
          - {seed: 7259, seat: 0}
          - {seed: 7260, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_high_leverage_harvest_timing_v0.py
