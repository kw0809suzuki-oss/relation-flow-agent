name: Investment Completion Coordinate v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/investment-completion-coordinate-v0-20260922]
    paths:
      - INVESTMENT_COMPLETION_COORDINATE_V0_RUN
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7111, seat: 0}
          - {seed: 7112, seat: 1}
          - {seed: 7113, seat: 0}
          - {seed: 7114, seat: 1}
          - {seed: 7115, seat: 0}
          - {seed: 7116, seat: 1}
          - {seed: 7117, seat: 0}
          - {seed: 7118, seat: 1}
          - {seed: 7119, seat: 0}
          - {seed: 7120, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_investment_completion_coordinate_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: investment-completion-coordinate-v0-${{ matrix.seed }}
          path: investment_completion_coordinate_v0_${{ matrix.seed }}.json
