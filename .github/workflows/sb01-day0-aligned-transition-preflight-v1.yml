name: SB01 Day0 Aligned Transition Preflight v1

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - SB01_DAY0_ALIGNED_PREFLIGHT_RUN
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BATTLE_SEED: 7001
      BATTLE_SEAT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_sb01_day0_aligned_transition_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: sb01-day0-aligned-preflight-7001
          path: sb01_day0_aligned_transitions_7001.json
