name: Strong Origin v2 Body-only v0 Preflight

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/strong-origin-v2-body-only-v0-preflight.yml
  workflow_dispatch:

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BATTLE_SEED: 7301
      BATTLE_SEAT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_strong_origin_v2_body_only_pair_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: strong-origin-v2-body-only-v0-preflight
          path: strong_origin_v2_body_only_pair_v0_7301.json
