name: WB Colab-equivalent smoke

on:
  push:
    paths:
      - ".github/workflows/wb-colab-equivalent-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps
        run: python -m pip install requests jsonschema
      - name: Fetch pinned Kaggle environment
        run: |
          python - <<'PY'
          import urllib.request, zipfile
          sha="b2405492c8403f6649f9317290f215e0290a2425"
          url=f"https://github.com/Kaggle/kaggle-environments/archive/{sha}.zip"
          urllib.request.urlretrieve(url, "ke.zip")
          with zipfile.ZipFile("ke.zip") as z: z.extractall(".")
          PY
      - name: Run seed 6104
        run: |
          python - <<'PY'
          import os, sys, json, copy
          from pathlib import Path
          sha="b2405492c8403f6649f9317290f215e0290a2425"
          sys.path.insert(0, str(Path(f"kaggle-environments-{sha}").resolve()))
          sys.path.insert(0, str(Path(".").resolve()))
          from kaggle_environments import make
          import g17_agent as current
          import agent as opponent

          flags={
            "ORIGIN_GATE_POLARITY":"inverted","ORIGIN_GATE_MAGNITUDE":"0.04",
            "G15_CONNECT_OPPONENT_FIELD_DESCRIPTION":"1","G15_ADAPTIVE_W_AMPLITUDE":"1",
            "G15_REMOVE_R_RELATION":"0","G15_REMOVE_E_RELATION":"0","G15_REMOVE_W_RELATION":"0",
            "G15_DISABLE_RESONANCE_CONTROL":"0","ORIGIN_CROP_COMMITMENT":"1"
          }
          for k,v in flags.items(): os.environ[k]=v
          def safe(obj,name,*args):
              f=getattr(obj,name,None)
              return f(*args) if callable(f) else None
          safe(current,"set_probe_enabled",True); safe(current,"set_attribution_enabled",True)
          safe(current,"reset_telemetry"); safe(current,"reset_trace")
          safe(opponent,"reset_telemetry"); safe(opponent,"reset_trace")
          turns=[]
          def observed(obs):
              me=obs["farms"][obs["player"]]
              action=current.agent(obs)
              turns.append({"turn":len(turns),"day":obs.get("day"),"hour":obs.get("hour"),"money":me.get("money"),"action":copy.deepcopy(action)})
              return action
          env=make("kaggriculture",configuration={"seed":6104},debug=False)
          env.run([observed,opponent.agent])
          rewards=[float(s.reward) for s in env.state]
          out={"seed":6104,"rewards":rewards,"margin":rewards[0]-rewards[1],"turns":len(turns),"first":turns[:2],"last":turns[-2:]}
          Path("wb-smoke-result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wb-colab-equivalent-smoke
          path: wb-smoke-result.json
