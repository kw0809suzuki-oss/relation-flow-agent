name: Production v2 Capacity Conversion Observation

on:
  push:
    paths:
      - 'run_production_v2_capacity_conversion_observation.py'
      - 'production_agent_v2_capacity_bridge.py'
      - 'production_agent_v1.py'
      - '.github/workflows/production-v2-capacity-conversion-observation.yml'
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: python -m py_compile run_production_v2_capacity_conversion_observation.py production_agent_v2_capacity_bridge.py production_agent_v1.py full_strong_origin_v1.py g8_agent.py strong_origin_g5.py strong_origin_g5_roi.py x_engine.py
      - name: Run conversion observation
        run: python run_production_v2_capacity_conversion_observation.py
      - name: Validate observation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('production_v2_capacity_conversion_observation.json').read_text())
          assert d['summary']['cases']==30
          assert d['bundle_used_for_control'] is False
          assert d['relation_used_for_control'] is False
          assert d['flow_used_for_control'] is False
          assert d['terminal_attached_after_trace'] is True
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-v2-capacity-conversion-observation
          path: production_v2_capacity_conversion_observation.json
