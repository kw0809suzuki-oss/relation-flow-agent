name: Phase A External Discriminator Pair v0
permissions:
  contents: read
on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/phase-a-external-discriminator-pair-v0.yml
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 8801, seat: 0}
          - {seed: 8806, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_phase_a_external_discriminator_pair_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase-a-external-discriminator-${{ matrix.seed }}
          path: phase_a_external_discriminator_pair_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json
  aggregate:
    needs: capture
    if: ${{ needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-a-external-discriminator-*
          path: phase-a-external-discriminator-artifacts
          merge-multiple: true
      - run: python analyze_phase_a_external_discriminator_pair_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase_a_external_discriminator_pair_v0_result.json
          git commit -m "Record Phase A external discriminator pair v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
