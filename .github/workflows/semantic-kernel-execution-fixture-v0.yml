name: Semantic Kernel Execution Fixture v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - semantic_kernel_wheat3_execution_fixture_v0.py
      - run_semantic_kernel_execution_fixture_v0.py
      - .github/workflows/semantic-kernel-execution-fixture-v0.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_semantic_kernel_execution_fixture_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-kernel-execution-fixture-v0
          path: semantic_kernel_execution_fixture_v0_result.json
