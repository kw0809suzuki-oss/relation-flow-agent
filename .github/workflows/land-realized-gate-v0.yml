name: LAND Realized Gate v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - land_realized_gate_v0.py
      - .github/workflows/land-realized-gate-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python land_realized_gate_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: land-realized-gate-v0
          path: land_realized_gate_v0.json
