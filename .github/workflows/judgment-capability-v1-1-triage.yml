name: Judgment Capability v1.1 Triage
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - judgment_guide_v1_1.py
      - judgment_capability_v1_1.py
      - run_judgment_capability_v1_1_packets.py
      - .github/workflows/judgment-capability-v1-1-triage.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_judgment_capability_v1_1_packets.py
      - uses: actions/upload-artifact@v4
        with:
          name: judgment-capability-v1-1-packets
          path: judgment_capability_v1_1_packets.json
