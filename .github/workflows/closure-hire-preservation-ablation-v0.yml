name: Closure HIRE Preservation Ablation v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/closure-hire-preservation-ablation-v0-20260922]
    paths:
      - CLOSURE_HIRE_PRESERVATION_ABLATION_V0_RUN
  workflow_dispatch:

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7061, seat: 0}
          - {seed: 7062, seat: 1}
          - {seed: 7063, seat: 0}
          - {seed: 7064, seat: 1}
          - {seed: 7065, seat: 0}
          - {seed: 7066, seat: 1}
          - {seed: 7067, seat: 0}
          - {seed: 7068, seat: 1}
          - {seed: 7069, seat: 0}
          - {seed: 7070, seat: 1}

    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_closure_hire_preservation_ablation_fresh10_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: closure-hire-preservation-ablation-v0-${{ matrix.seed }}
          path: closure_hire_preservation_ablation_v0_${{ matrix.seed }}.json
