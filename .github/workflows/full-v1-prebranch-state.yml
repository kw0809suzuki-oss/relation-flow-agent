name: Full v1 Prebranch State

on:
  workflow_dispatch:
  push:
    branches: [strong-origin-g5-port]
    paths:
      - observe_full_v1_prebranch_state.py
      - full_strong_origin_v1.py
      - strong_origin_g5_roi.py
      - strong_origin_g5.py
      - g8_agent.py
      - x_engine.py
      - scripts/fetch_opponent.sh
      - .github/workflows/full-v1-prebranch-state.yml

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile observer
        run: python -m py_compile observe_full_v1_prebranch_state.py full_strong_origin_v1.py strong_origin_g5_roi.py strong_origin_g5.py g8_agent.py x_engine.py
      - name: Run prebranch State observation
        run: python observe_full_v1_prebranch_state.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('full_v1_prebranch_state.json').read_text())
          assert d['observer_only'] and not d['agent_mutated']
          assert not d['terminal_read'] and not d['margin_read']
          assert len(d['cases'])==5
          assert len(d['cross_seed'])==15
          print([(x['turn'],x['distinct_signatures'],x['groups']) for x in d['cross_seed']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-v1-prebranch-state
          path: full_v1_prebranch_state.json
