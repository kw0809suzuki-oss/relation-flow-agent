name: Mode to Action Reachability Path v0
permissions:
  contents: read
on:
  push:
    branches: [observer/mode-to-action-reachability-path-v0-20260923]
    paths: [MODE_TO_ACTION_REACHABILITY_PATH_V0_RUN]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seed: 7171, seat: 0}
          - {seed: 7176, seat: 1}
          - {seed: 7177, seat: 0}
          - {seed: 7179, seat: 0}
          - {seed: 7180, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_mode_to_action_reachability_path_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: mode-to-action-reachability-path-v0-${{ matrix.seed }}
          path: mode_to_action_reachability_path_v0_${{ matrix.seed }}.json
  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: mode-to-action-reachability-path-v0-*, path: artifacts}
      - run: python aggregate_mode_to_action_reachability_path_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: mode-to-action-reachability-path-v0-aggregate
          path: mode_to_action_reachability_path_v0_aggregate.json
