name: Option Preserving Abstraction Probe

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - OPTION_PRESERVING_ABSTRACTION_RUN
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run abstraction probe
        run: python run_option_preserving_abstraction_probe.py
      - name: Validate boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('option_preserving_abstraction_probe.json').read_text())
          assert d['schema']=='kaggriculture.abstraction-probe.option-preserving.v0'
          assert d['abstraction']['direct_action_instruction'] is False
          assert d['abstraction']['direction_source']=='native_origin'
          assert d['causal_attribution'] is False
          assert d['promote'] is False
          assert d['summary']['total_received_snapshots'] > 0
          assert d['summary']['total_effect_snapshots'] > 0
          print(d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: option-preserving-abstraction-probe
          path: option_preserving_abstraction_probe.json
