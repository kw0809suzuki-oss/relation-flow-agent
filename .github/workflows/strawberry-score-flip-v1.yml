name: Strawberry Score Flip v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths: [strawberry_score_flip_v1.py, run_strawberry_score_flip_v1.py, .github/workflows/strawberry-score-flip-v1.yml]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_strawberry_score_flip_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: strawberry-score-flip-v1
          path: strawberry_score_flip_v1.json
