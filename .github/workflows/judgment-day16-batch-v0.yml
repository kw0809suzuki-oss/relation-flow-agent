name: Judgment Day16 Batch v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - judgment_day16_intervention_batch_v0.py
      - run_judgment_day16_batch_preflight_battle_v0.py
      - .github/workflows/judgment-day16-batch-v0.yml
  workflow_dispatch:

jobs:
  preflight_and_battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_judgment_day16_batch_preflight_battle_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: judgment-day16-batch-v0
          path: judgment_day16_batch_preflight_battle_v0.json
