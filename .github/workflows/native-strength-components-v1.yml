name: Native Strength Components v1
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths: [native_strength_components_v1.py, .github/workflows/native-strength-components-v1.yml]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python native_strength_components_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-strength-components-v1
          path: native_strength_components_v1.json
