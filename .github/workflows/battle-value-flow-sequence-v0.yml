name: Battle Value Flow Sequence v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - .github/workflows/battle-value-flow-sequence-v0.yml
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {seed: 7351, seat: 0}
          - {seed: 7352, seat: 1}
          - {seed: 7353, seat: 0}
          - {seed: 7354, seat: 1}
          - {seed: 7355, seat: 0}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_battle_value_flow_sequence_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: battle-value-flow-${{ matrix.seed }}
          path: battle_value_flow_sequence_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json

  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: battle-value-flow-*
          path: inputs
          merge-multiple: true
      - run: python analyze_battle_value_flow_sequence_v0.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: battle-value-flow-sequence-v0
          path: battle_value_flow_sequence_v0_result.json
