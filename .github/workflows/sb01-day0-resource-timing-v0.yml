name: SB01 Day0 Resource Timing v0

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [experiment/sb01-economic-layer-export-v0-20260923]
    paths:
      - SB01_DAY0_RESOURCE_TIMING_RUN
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 35831478953
          github-token: ${{ github.token }}
          pattern: sb01-day0-resource-flow-input-*
          path: inputs
          merge-multiple: true
      - run: python analyze_sb01_day0_resource_timing_v0.py inputs
      - uses: actions/upload-artifact@v4
        with:
          name: sb01-day0-resource-timing-v0
          path: sb01_day0_resource_timing_v0.json
