name: Beta Connection Discriminator V1

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - BETA_CONNECTION_DISCRIMINATOR_RUN
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Compile
        run: |
          python -m py_compile run_beta_connection_discriminator_v1.py run_pattern_validation_v1.py \
            run_pattern_mining_v1.py pattern_mining_observer.py \
            g15_agent.py g16_agent.py g17_agent.py strong_origin_body.py \
            origin_context_integrator.py origin_role_reader.py role_reentry_bridge.py \
            strong_origin.py g8_agent.py g7_agent.py agent.py x_engine.py
      - name: Run targeted six-seed observation
        run: python run_beta_connection_discriminator_v1.py
      - name: Validate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('beta_connection_discriminator_v1.json').read_text())
          assert d['observation_definitions_changed'] is False
          assert d['new_features_added'] is False
          assert d['terminal_used_during_observation'] is False
          assert len(d['cases']) == 6
          print([(c['seed'], c['connection_outcome'], c['margin_delta']) for c in d['cases']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-connection-discriminator-v1
          path: beta_connection_discriminator_v1.json
