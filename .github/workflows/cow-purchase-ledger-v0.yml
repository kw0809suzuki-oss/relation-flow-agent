name: COW Purchase Ledger v0
permissions: {contents: read}
on:
  push:
    branches: [observer/cow-purchase-ledger-v0-20260923]
    paths: [COW_PURCHASE_LEDGER_V0_RUN]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7271, seat: 0}
          - {seed: 7272, seat: 1}
          - {seed: 7273, seat: 0}
          - {seed: 7274, seat: 1}
          - {seed: 7275, seat: 0}
          - {seed: 7276, seat: 1}
          - {seed: 7277, seat: 0}
          - {seed: 7278, seat: 1}
          - {seed: 7279, seat: 0}
          - {seed: 7280, seat: 1}
    env: {BATTLE_SEED: "${{ matrix.seed }}", BATTLE_SEAT: "${{ matrix.seat }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_cow_purchase_ledger_v0.py
      - uses: actions/upload-artifact@v4
        with: {name: "cow-purchase-ledger-v0-${{ matrix.seed }}", path: "cow_purchase_ledger_v0_${{ matrix.seed }}.json"}
  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "cow-purchase-ledger-v0-*", path: artifacts}
      - run: python aggregate_cow_purchase_ledger_v0.py
      - uses: actions/upload-artifact@v4
        with: {name: cow-purchase-ledger-v0-aggregate, path: cow_purchase_ledger_v0_aggregate.json}
