name: WHEAT Market Overlap v0
permissions: {contents: read}
on:
  push:
    branches: [observer/wheat-market-overlap-v0-20260923]
    paths: [WHEAT_MARKET_OVERLAP_V0_RUN]
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 7301, seat: 0}
          - {seed: 7302, seat: 1}
          - {seed: 7303, seat: 0}
          - {seed: 7304, seat: 1}
          - {seed: 7305, seat: 0}
          - {seed: 7306, seat: 1}
          - {seed: 7307, seat: 0}
          - {seed: 7308, seat: 1}
          - {seed: 7309, seat: 0}
          - {seed: 7310, seat: 1}
    env: {BATTLE_SEED: "${{ matrix.seed }}", BATTLE_SEAT: "${{ matrix.seat }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_wheat_market_overlap_v0.py
      - uses: actions/upload-artifact@v4
        with: {name: "wheat-market-overlap-v0-${{ matrix.seed }}", path: "wheat_market_overlap_v0_${{ matrix.seed }}.json"}
  aggregate:
    needs: observe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "wheat-market-overlap-v0-*", path: artifacts}
      - run: python aggregate_wheat_market_overlap_v0.py
      - uses: actions/upload-artifact@v4
        with: {name: wheat-market-overlap-v0-aggregate, path: wheat_market_overlap_v0_aggregate.json}
