name: State Transition Pressure Trace v0
permissions:
  contents: read
on:
  push:
    branches: [observer/state-transition-pressure-trace-v0-20260923]
    paths: [STATE_TRANSITION_PRESSURE_TRACE_V0_RUN]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BATTLE_SEED: 7161
      BATTLE_SEAT: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_state_transition_pressure_trace_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: state-transition-pressure-trace-v0-7161
          path: state_transition_pressure_trace_v0_7161.json
