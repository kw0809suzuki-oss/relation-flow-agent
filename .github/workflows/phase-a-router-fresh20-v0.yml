name: Phase A Router fresh20 v0
permissions:
  contents: read
on:
  push:
    branches: [observer/wr02-value-carry-reanchor-v0-20260925]
    paths:
      - .github/workflows/phase-a-router-fresh20-v0.yml
  workflow_dispatch:
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {seed: 8501, seat: 0}
          - {seed: 8502, seat: 1}
          - {seed: 8503, seat: 0}
          - {seed: 8504, seat: 1}
          - {seed: 8505, seat: 0}
          - {seed: 8506, seat: 1}
          - {seed: 8507, seat: 0}
          - {seed: 8508, seat: 1}
          - {seed: 8509, seat: 0}
          - {seed: 8510, seat: 1}
          - {seed: 8511, seat: 0}
          - {seed: 8512, seat: 1}
          - {seed: 8513, seat: 0}
          - {seed: 8514, seat: 1}
          - {seed: 8515, seat: 0}
          - {seed: 8516, seat: 1}
          - {seed: 8517, seat: 0}
          - {seed: 8518, seat: 1}
          - {seed: 8519, seat: 0}
          - {seed: 8520, seat: 1}
    env:
      BATTLE_SEED: ${{ matrix.seed }}
      BATTLE_SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_phase_a_router_fresh20_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase-a-router-${{ matrix.seed }}
          path: phase_a_router_fresh20_v0_${{ matrix.seed }}_seat${{ matrix.seat }}.json
  aggregate:
    needs: battle
    if: ${{ needs.battle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-a-router-*
          path: phase-a-router-artifacts
          merge-multiple: true
      - run: python analyze_phase_a_router_fresh20_v0.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase_a_router_fresh20_v0_result.json
          git commit -m "Record Phase A Router fresh20 v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
