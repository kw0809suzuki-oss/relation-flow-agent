name: Hour11 Value Transition v1
on:
  workflow_dispatch:
  push:
    branches: [scale-chassis-v1]
    paths:
      - 'observe_hour11_value_transition_v1.py'
      - '.github/workflows/hour11-value-transition-v1.yml'
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch opponent
        run: bash scripts/fetch_opponent.sh
      - name: Observe hour11 value transition
        run: python observe_hour11_value_transition_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: hour11-value-transition-v1
          path: hour11_value_transition_v1.json
