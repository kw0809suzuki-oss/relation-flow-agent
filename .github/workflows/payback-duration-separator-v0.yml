name: Payback Duration Separator v0
on:
  push:
    branches: [milk-low-price-hold-v1]
    paths:
      - run_payback_duration_separator_v0.py
      - .github/workflows/payback-duration-separator-v0.yml
  workflow_dispatch:
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh
      - run: python run_payback_duration_separator_v0.py
      - uses: actions/upload-artifact@v4
        with:
          name: payback-duration-separator-v0
          path: payback_duration_separator_v0.json
