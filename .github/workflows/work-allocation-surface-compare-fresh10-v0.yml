name: Work Allocation Surface Compare fresh10 v0

permissions:
  contents: read

on:
  push:
    branches: [experiment/cross-view-timeline-v0-20260928]
    paths:
      - .github/workflows/work-allocation-surface-compare-fresh10-v0.yml
      - run_work_allocation_surface_compare_fresh10_v0.py
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      - run: bash scripts/fetch_opponent.sh

      - name: Run Work Allocation Surface compare
        run: python run_work_allocation_surface_compare_fresh10_v0.py

      - uses: actions/upload-artifact@v4
        with:
          name: work-allocation-surface-compare-fresh10-v0
          path: work_allocation_surface_compare_fresh10_v0_result.json

      - name: Record result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work_allocation_surface_compare_fresh10_v0_result.json
          git commit -m "Record Work Allocation Surface compare fresh10 v0" || exit 0
          git push origin HEAD:"${GITHUB_REF_NAME}"
