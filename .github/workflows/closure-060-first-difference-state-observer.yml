name: Closure 060 First Difference State Observer

permissions:
  contents: read

on:
  push:
    branches:
      - experiment/closure-gain-sweep-20260921
    paths:
      - CLOSURE_060_FIRST_DIFF_STATE_RUN
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Fetch pinned opponent
        run: bash scripts/fetch_opponent.sh
      - name: Run one-shot observer
        run: python run_closure_060_first_difference_state_observer_v0.py
      - name: Validate observer boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('closure_060_first_difference_state_observer_v0.json').read_text())
          assert d['schema']=='kaggriculture.closure-060-first-difference-state-observer.v0'
          assert len(d['rows'])==8
          assert d['boundary']['one_observation_only'] is True
          assert d['boundary']['no_new_intervention'] is True
          assert d['boundary']['promote'] is False
          assert d['boundary']['adopt'] is False
          print(json.dumps(d['rows'], separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: closure-060-first-difference-state-observer-v0
          path: closure_060_first_difference_state_observer_v0.json
